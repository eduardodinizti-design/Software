[pytest]
# NÃO coletar artefatos de build (dist/ do PyInstaller traz milhares de testes do numpy que
# poluem a suíte e vazam estado global entre arquivos). Só o código do projeto é testado.
norecursedirs = dist build .git __pycache__ *.egg-info node_modules .venv venv logs recon
addopts = -p no:cacheprovider
