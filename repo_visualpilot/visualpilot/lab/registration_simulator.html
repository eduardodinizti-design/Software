<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><title>Laboratório de inscrições</title>
<style>
body{font:18px Arial,sans-serif;background:#eff3f7;color:#172434;margin:30px}
main{max-width:820px;margin:auto}h1{font-size:28px}#popup{background:white;border:2px solid #668092;border-radius:12px;padding:24px;width:650px}
#popup p{font-size:28px;margin:12px 0}button{font:20px Arial;padding:10px 20px;margin:8px;border-radius:6px;border:1px solid #789;background:#edf4ff;cursor:pointer}
#mode{font-weight:bold}small{display:block;margin:14px 0;line-height:1.5}
</style>
<main><h1>Inscrição com fichas fictícias</h1>
<small>Simulador isolado. As mudanças afetam somente esta página.<br>Custo da inscrição e stack recebido são valores diferentes.</small>
<div><button onclick="lab.mode='paused';lab.revision++;showMode()">Pausar</button><button onclick="lab.mode='manual';lab.revision++;showMode()">Assumir manual</button><button onclick="lab.mode='automatic';lab.revision++;showMode()">Retomar</button></div>
<p id="mode"></p><section id="popup"></section></main>
<script>
window.lab={revision:0,mode:'automatic',actions:[],receipt:null,token:null};
function showMode(){document.querySelector('#mode').textContent='Controle: '+lab.mode}
function render(){
 const o=lab.offer,p=document.querySelector('#popup');p.replaceChildren();
 const rows=['LABORATORIO FICTICIO','Torneio: '+o.tournament,'Oferta: '+o.offer];
 if(!lab.receipt)rows.push('Tipo: '+o.kind,'Bounty: '+(o.bounty?'SIM':'NAO'));
 rows.push('Custo: '+o.amount+' fichas ficticias');
 if(lab.receipt)rows.push('Inscricao: '+lab.receipt);
 else rows.push('Stack: '+o.stack,'Minimo: '+o.minimum,'Maximo: '+o.maximum,'Passo: '+o.step);
 for(const text of rows){const line=document.createElement('p');line.textContent=text;p.append(line)}
 if(!lab.receipt)for(const [action,label] of [['decrease','Menos'],['increase','Mais'],['register','Registrar']]){
  const b=document.createElement('button');b.id=action;b.textContent=label;
  b.onclick=()=>mutate(action);p.append(b);
 }
 showMode();
}
function mutate(action){
 if(lab.mode==='paused'||lab.receipt)return;
 const o=lab.offer;
 if(action==='register'){lab.receipt=lab.reject?'RECUSADA':'CONFIRMADA'}
 else if(!lab.stuck){o.amount=Math.min(o.maximum,Math.max(o.minimum,o.amount+(action==='increase'?o.step:-o.step)))}
 lab.actions.push({action,amount:o.amount});lab.revision++;render();
}
window.resetLab=(offer)=>{
 lab.offer={...offer};lab.actions=[];lab.receipt=null;lab.token=null;lab.reject=false;lab.stuck=false;
 lab.mode='automatic';lab.revision++;render();
};
window.applyLabAt=({action,point,revision,token})=>{
 if(lab.mode!=='automatic'||revision!==lab.revision||lab.receipt)return false;
 if(!Array.isArray(point)||point.length!==2||!point.every(Number.isFinite))return false;
 const button=document.elementFromPoint(point[0],point[1])?.closest('button');
 if(!button||!document.querySelector('#popup').contains(button)||button.id!==action||button.disabled)return false;
 lab.token=token;button.click();return true;
};
resetLab({tournament:'T1',offer:'P1',kind:'MTT',bounty:false,amount:10,stack:10000,minimum:10,maximum:100,step:5});
</script></html>
