[central]
; Preencha com o IPv4 do notebook onde a Central recebe as imagens.
host =
port = 48735

[member]
id =

[capture]
table_width = 835
table_height = 1485
max_tables = 6

[transport]
; PNG permanece o padrão sem perdas. JPEG é uma opção experimental de laboratório.
; JPEG usa amostragem de cor 4:4:4; a qualidade deve estar entre 1 e 100.
image_codec = png
jpeg_quality = 100
