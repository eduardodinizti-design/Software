name: Windows laboratory
on:
  workflow_dispatch:
  push:
    branches: [entrega-visualpilot-piloto]
jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create environment
        run: python tools/run_windows_stage.py --name create-environment -- -m venv .venv
      - name: Prepare desktop for three visible laboratory tables
        shell: powershell
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Test, build and validate desktop capture, Central and table rearrangement
        shell: powershell
        run: ./build_windows.ps1
      - name: Publish laboratory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-laboratory-evidence
          path: |
            diagnostics/
            dist/startup-validation*
            dist/VisualPilot_Central/central_startup.log
      - name: Publish validated candidate executables
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-laboratory-candidate
          path: dist/
          if-no-files-found: error
