        git -C "$RUNNER_TEMP/TexasSolver" checkout 02c8021ee1307c18aa1e76b772c6ae1451601bc6

        python tools/build_texassolver_console.py --source "$RUNNER_TEMP/TexasSolver" --fmt-include /usr/include --out "$RUNNER_TEMP/hu-native/solver-stream" --stream-export

        cp "$RUNNER_TEMP/hu-native/solver-stream.manifest.json" runtime/native-build.json

        '
    - if: steps.reuse.outputs.reused != 'true'
      name: Check conditional gating, the immutable game and asymmetric native stacks
      run: 'HU_STREAM_TEST_BINARY="$RUNNER_TEMP/hu-native/solver-stream" HU_STREAM_TEST_RESOURCES="$RUNNER_TEMP/TexasSolver/resources" python -m unittest test_hu_sb40_series test_hu_sb40_complete51
        test_hu_sb40_complete34 test_hu_sb40_next16 test_hu_blind_war test_hu_campaign_download -q

        '
    - if: steps.reuse.outputs.reused != 'true'
      name: Calculate and preserve complete three-street actions, frequencies, sizes and replies
      run: python tools/hu_batch16.py case --plan "$PLAN" --ordinal ${{ matrix.ordinal }} --binary "$RUNNER_TEMP/hu-native/solver-stream" --resources "$RUNNER_TEMP/TexasSolver/resources"
