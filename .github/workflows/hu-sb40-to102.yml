    - run: python tools/finalize_hu_sb40_series.py --target 68 --catalog-asset "${{ needs.catalog68.outputs.catalog_asset }}" --native-run "${{ github.run_id }}" --output runtime/hu-sb40-68-final
    - run: python tools/verify_hu_sb40_series_publication.py --target 68 --run "${{ github.run_id }}" --catalog-asset "${{ needs.catalog68.outputs.catalog_asset }}" --output runtime/hu-sb40-68-publication-check
    - run: 'cp runtime/hu-sb40-68-publication-check/publicacao-final-verificada.json runtime/publicacao-final-verificada-sb40-68-${{ github.run_id }}-a${{ github.run_attempt }}.json

        gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" runtime/publicacao-final-verificada-sb40-68-${{ github.run_id }}-a${{ github.run_attempt }}.json

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: sb40-68-final-publication-a${{ github.run_attempt }}
        path: 'runtime/hu-sb40-68-final/*.json

          runtime/hu-sb40-68-final/*.txt

          runtime/hu-sb40-68-publication-check/*.json

          runtime/hu-sb40-68-publication-check/*.txt

          '
        retention-days: 30
    env:
      TAG: hu-sb-bb40-nvt-complete68-20261116
      PLAN: runtime/inputs/sb40-complete68-plan.json
      CHECKPOINT: runtime/inputs/checkpoint-primeiros51.json
      HU_GITHUB_STATUS_PREFIX: hu-sb40-complete68
    name: Deliver SB40 68 and verify publication
  initialize85:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
