          runtime/hu-sb40-102-case/**/*.txt

          runtime/hu-sb40-102-case/**/*.log

          '
        retention-days: 30
    - name: Preserve native output if later conversion or publication fails
      id: recovery
      if: failure()
      run: "python - <<'PY'\nimport os,pathlib\nroot=pathlib.Path('runtime/hu-sb40-102-case/study')\nfor pattern in ('delivery/parts/*','delivery/*.zip','bank/policies/*.sqlite','bank/temporary/*/native/strategy.jsonl.gz'):\n\
        \    if any(root.glob(pattern)):\n        with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('path='+str(root/pattern)+'\\n')\n        break\nPY\n"
