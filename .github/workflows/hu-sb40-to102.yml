      name: Wait for 68 complete saved Windows-verified models before allocating the next seventeen
      run: python tools/prepare_hu_sb40_series.py init --target 85 --parent-run "${{ github.run_id }}" --output runtime/inputs --wait-seconds 300 --publish
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ steps.meta.outputs.artifact }}
        path: runtime/inputs/*.json
        retention-days: 30
    needs:
    - deliver68
    env:
      TAG: hu-sb-bb40-nvt-complete85-20261116
      PLAN: runtime/inputs/sb40-complete85-plan.json
      CHECKPOINT: runtime/inputs/checkpoint-primeiros68.json
