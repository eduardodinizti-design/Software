name: Strict client capture contracts and Windows GDI
on:
  push:
    branches: [fix/strict-client-capture]
    paths: ['**.py', '.github/workflows/strict-capture-tests.yml']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 opencv-python==4.11.0.86 psutil==6.1.1 pytesseract==0.3.13
      - name: Run contracts and native GDI on controlled Tk window
        shell: pwsh
        run: |
          python -m unittest test_capture_regressions test_window_capture_engine test_window_capture_audit test_capture_windows_native test_table_reading test_rank_confirmation test_diagnostic_storage test_continuous_observer test_capture_review test_region_presentation test_action_buttons test_lab_metrics test_corner_sampling test_community_cards test_detector_batch test_detector_proposals test_ocr_runtime test_rank_templates test_button_templates test_roi_geometry test_template_sample_collection test_exact_call_template test_manual_windows -v *> capture-test-results.txt
          $code = $LASTEXITCODE
          Get-Content capture-test-results.txt
          exit $code
      - name: Record results in branch
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const filePath = 'docs/capture-fix/windows-test-results.txt';
            const branch = 'fix/strict-client-capture';
            let sha;
            try {sha=(await github.rest.repos.getContent({...context.repo,path:filePath,ref:branch})).data.sha;}
            catch(e) {if(e.status!==404) throw e;}
            const text = 'Run: '+context.runId+'\nSource commit: '+context.sha+'\n'+
              (fs.existsSync('capture-test-results.txt')?fs.readFileSync('capture-test-results.txt','utf8'):'Tests did not execute; inspect workflow.');
            await github.rest.repos.createOrUpdateFileContents({...context.repo,path:filePath,branch,sha,
              message:'Record native capture test results',content:Buffer.from(text).toString('base64')});
