name: HU recovered SB40 actual full policy on Windows and final delivery
on:
  push:
    branches: [feat/hu-close32-sb40-20261115]
    paths: [.github/workflows/hu-sb40-recovered-windows.yml]
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ github.token }}
  PYTHONUTF8: '1'
  OPENBLAS_NUM_THREADS: '1'
  SB_CATALOG: batch-catalog-43777381626.json
jobs:
  contracts:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.2.6 opencv-python==4.11.0.86 psutil==6.1.1 pytesseract==0.3.13
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime/hu-sb40-contracts | Out-Null
          python -m unittest test_hu_campaign test_hu_blind_war test_hu_campaign_download test_hu_campaign_delivery test_hu_policy_json test_hu_next16 test_hu_reference test_hu_batches test_hu_policy_engine test_hu_operational test_cursor test_window_capture_engine test_window_capture_audit test_capture_windows_native test_raise_plan test_raise_sequencer -v *> runtime/hu-sb40-contracts/contracts.txt
          $code = $LASTEXITCODE
          Get-Content runtime/hu-sb40-contracts/contracts.txt -Tail 18
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hu-sb40-recovered-windows-contracts-a${{ github.run_attempt }}
          path: runtime/hu-sb40-contracts/contracts.txt
          retention-days: 14
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item runtime/hu-sb40-contracts/contracts.txt runtime/windows-contracts-sb40-${{ github.run_id }}-a${{ github.run_attempt }}.txt
          gh release upload hu-sb-bb40-nvt-pilot-20261115 --repo "$env:GITHUB_REPOSITORY" runtime/windows-contracts-sb40-${{ github.run_id }}-a${{ github.run_attempt }}.txt
  await-sb:
    runs-on: ubuntu-24.04
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.2.6
      - run: python tools/wait_hu_campaign.py --tag hu-sb-bb40-nvt-pilot-20261115 --catalog-asset "$SB_CATALOG" --seconds 12500 --output runtime/hu-sb40-recovered-readiness.json
  actual-data:
    needs: [contracts, await-sb]
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.2.6
      - run: python tools/validate_hu_campaign_windows.py --family sb40 --ordinal 1 --catalog-asset "$env:SB_CATALOG" --output runtime/hu-sb40-proof
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item runtime/hu-sb40-proof/windows-proof.json runtime/windows-sb40-case-01-${{ github.run_id }}-a${{ github.run_attempt }}.json
          Compress-Archive -Path runtime/hu-sb40-proof/windows-proof,runtime/hu-sb40-proof/request-*.json,runtime/hu-sb40-proof/response-*.json -DestinationPath runtime/windows-sb40-case-01-${{ github.run_id }}-a${{ github.run_attempt }}-json-history.zip
          gh release upload hu-sb-bb40-nvt-pilot-20261115 --repo "$env:GITHUB_REPOSITORY" runtime/windows-sb40-case-01-${{ github.run_id }}-a${{ github.run_attempt }}.json runtime/windows-sb40-case-01-${{ github.run_id }}-a${{ github.run_attempt }}-json-history.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hu-sb40-recovered-windows-proof-a${{ github.run_attempt }}
          path: |
            runtime/hu-sb40-proof/windows-proof.json
            runtime/hu-sb40-proof/windows-proof/*.json
            runtime/hu-sb40-proof/request-*.json
            runtime/hu-sb40-proof/response-*.json
            runtime/hu-sb40-proof/download/download-receipt.json
          retention-days: 14
  deliver:
    needs: actual-data
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.2.6
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/finalize_hu_campaign.py --family sb40 --catalog-asset "$SB_CATALOG" --windows-run-id "${{ github.run_id }}" --output runtime/hu-sb40-final
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hu-sb40-recovered-final-a${{ github.run_attempt }}
          path: |
            runtime/hu-sb40-final/*.json
            runtime/hu-sb40-final/*.txt
          retention-days: 14
