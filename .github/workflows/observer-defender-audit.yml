name: Observer package Microsoft Defender audit
on:
  push:
    branches: [delivery/observer-windows-20261105]
    paths: ['.github/workflows/observer-defender-audit.yml']
permissions:
  contents: write
jobs:
  scan:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download exact package and scan without execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'defender-report'
          $sample = Join-Path $env:RUNNER_TEMP 'observer-sample'
          New-Item -ItemType Directory -Force $out,$sample | Out-Null
          Start-Transcript -Path (Join-Path $out 'scan.txt')
          try {
            Get-MpComputerStatus | Format-List *
            try { Update-MpSignature } catch { Write-Warning $_ }
            $zip = Join-Path $sample 'VisualPilot_Observador_Windows.zip'
            Invoke-WebRequest 'https://raw.githubusercontent.com/eduardodinizti-design/Software/00233c609f583c2022ff076d975c862c4b691cbb/delivery/VisualPilot_Observador_Windows.zip' -OutFile $zip
            $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne '004c4d2afc28461d9f419003297538539344045b07f6b5dc45db6c361b18984c') { throw 'Hash mismatch' }
            Write-Output "Sample SHA256: $hash"
            Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $sample 'expanded')
            $scanner = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $scanner) { throw 'Defender scanner unavailable' }
            & $scanner.FullName -Scan -ScanType 3 -File $sample
            $scanExit = $LASTEXITCODE
            Write-Output "Defender exit: $scanExit"
            if ($scanExit -ne 0) { throw "Defender scan returned $scanExit" }
          } finally {
            Get-MpComputerStatus | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $out 'engine.json')
            Get-MpThreatDetection | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $out 'detections.json')
            Get-MpThreat | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $out 'threats.json')
            Stop-Transcript
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: defender-audit-results
          path: ${{ runner.temp }}/defender-report
      - name: Publish audit evidence without sample files
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const directory = path.join(process.env.RUNNER_TEMP, 'defender-report');
            const evidence = {run: context.runId, files: {}};
            if (fs.existsSync(directory)) {
              for (const name of ['scan.txt', 'engine.json', 'detections.json', 'threats.json']) {
                const file = path.join(directory, name);
                if (fs.existsSync(file)) evidence.files[name] = fs.readFileSync(file, 'utf8');
              }
            }
            const filePath = 'docs/security/observer-defender-evidence.json';
            const branch = 'delivery/observer-windows-20261105';
            let sha;
            try { sha = (await github.rest.repos.getContent({...context.repo, path:filePath, ref:branch})).data.sha; }
            catch (e) { if(e.status !== 404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({...context.repo, path:filePath, branch,
              message:'Record Defender audit evidence (no sample execution)', sha,
              content:Buffer.from(JSON.stringify(evidence,null,2)).toString('base64')});
