name: HU SB40 reuse converged export and repair covering shoves
on:
  push:
    branches: [feat/hu-close32-sb40-20261115]
    paths: [.github/workflows/hu-sb40-recover.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  statuses: write
env:
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  HU_GITHUB_STATUS_PREFIX: hu-sb40-recovery
  HU_GITHUB_STATUS_CONTEXT: hu-sb40-recovery/01
  PLAN: docs/software-hu-close32-sb40-20261115/sb40-plan.json
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Release optional SDK storage on this new disposable runner
        run: |
          test "$GITHUB_ACTIONS" = true
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .
      - run: python -m pip install numpy==2.2.6 opencv-python-headless==4.11.0.86 psutil==6.1.1 pytesseract==0.3.13
      - name: Verify strict legal shove translation and existing campaign contracts
        run: python -m unittest test_hu_blind_war test_hu_campaign test_hu_campaign_delivery test_hu_reference -q
      - uses: actions/download-artifact@v4
        with:
          name: hu-sb40-diagnostics-a1
          run-id: 43769679234
          github-token: ${{ github.token }}
          path: runtime/sb40-source-diagnostics
      - name: Publish the small original failure evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import pathlib,zipfile
          root=pathlib.Path('runtime/sb40-source-diagnostics')
          with zipfile.ZipFile('runtime/sb40-original-failure-43769679234-${{ github.run_id }}-a${{ github.run_attempt }}.zip','w',compression=zipfile.ZIP_DEFLATED) as z:
              for path in root.rglob('*'):
                  if path.is_file():z.write(path,str(path.relative_to(root)))
          PY
          gh release upload hu-sb-bb40-nvt-pilot-20261115 --repo "$GITHUB_REPOSITORY" runtime/sb40-original-failure-43769679234-${{ github.run_id }}-a${{ github.run_attempt }}.zip
      - uses: actions/download-artifact@v4
        with:
          name: hu-sb40-policy-recovery-a1
          run-id: 43769679234
          github-token: ${{ github.token }}
          path: runtime/sb40-source-export
      - name: Mark this workflow's new download for bounded cleanup after validation
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('runtime/sb40-source-export/owned-recovery-download.json')
          p.write_text(json.dumps(dict(schema='software.hu-sb40-recovery-download.v1',source_run=43769679234,artifact_id=14186865931)))
          PY
      - name: Compact and verify the original 171-iteration export without running CFR again
        env:
          GH_TOKEN: ${{ github.token }}
          HU_GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python tools/recover_hu_sb40.py --export-dir runtime/sb40-source-export --diagnostics-dir runtime/sb40-source-diagnostics --output runtime/sb40-recovered-study
      - name: Publish the recovered full bank and a fresh immutable complete catalog
        env:
          GH_TOKEN: ${{ github.token }}
          HU_GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python tools/hu_batch16.py case --plan "$PLAN" --ordinal 1 --ready-study runtime/sb40-recovered-study --output runtime/sb40-recovered-publication
          python tools/hu_batch16.py catalog --plan "$PLAN" --output runtime/sb40-recovered-catalog
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hu-sb40-recovery-diagnostics-a${{ github.run_attempt }}
          path: |
            runtime/sb40-recovered-study/**/*.json
            runtime/sb40-recovered-study/**/*.txt
            runtime/sb40-recovered-study/**/*.log
            runtime/sb40-recovered-publication/**/*.json
            runtime/sb40-recovered-catalog/*
          retention-days: 14
